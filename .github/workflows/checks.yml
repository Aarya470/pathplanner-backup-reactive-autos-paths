name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.35.7

jobs:
  app:
    name: App - analyze and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate mocks
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  lib:
    name: Reactive Autonomous Pathing - test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # Build Robot Detection from its release tag, so this works even before it is on GitHub Pages
      - name: Find the Robot Detection version
        id: rd
        run: echo "version=$(sed -n "s/^def robotDetectionVersion = '\(.*\)'/\1/p" reactive-pathing/build.gradle)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: Aarya470/FRC-Robot-Vision
          ref: v${{ steps.rd.outputs.version }}
          path: robot-detection-src

      - name: Build Robot Detection locally
        working-directory: ./robot-detection-src
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PreleaseVersion=${{ steps.rd.outputs.version }}

      - name: Build and test
        working-directory: ./reactive-pathing
        run: |
          chmod +x gradlew
          ./gradlew build
