name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version to release, for example 1.0.1
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.35.7
  APP_NAME: PathPlannerBackupPaths
  SITE_URL: https://aarya470.github.io/pathplanner-backup-reactive-autos-paths

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if ! grep -qx "## $V" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $V' section. Add the release notes for $V first."
            exit 1
          fi

  app:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
          - os: ubuntu-22.04
            platform: linux
    name: App - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Set app version
        run: dart run cider version "${VERSION}+${{ github.run_number }}"

      - name: Build app
        run: flutter build ${{ matrix.platform }} --release

      - name: Package Windows
        if: matrix.platform == 'windows'
        run: |
          cp windows/redist/msvcp140.dll windows/redist/vcruntime140.dll windows/redist/vcruntime140_1.dll build/windows/x64/runner/Release/
          cp TERMS.txt build/windows/x64/runner/Release/
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a "$GITHUB_WORKSPACE/dist/${APP_NAME}-v${VERSION}-Windows-portable.zip" .

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: windows_installer.iss
          options: /O+ /F"${{ env.APP_NAME }}-v${{ env.VERSION }}-Windows-setup"

      - name: Collect Windows installer
        if: matrix.platform == 'windows'
        run: cp build/windows/x64/installer/*.exe dist/

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          cp TERMS.txt build/macos/Build/Products/Release/
          cd build/macos/Build/Products/Release
          zip -qr --symlinks "$GITHUB_WORKSPACE/dist/${APP_NAME}-v${VERSION}-macOS.zip" "${APP_NAME}.app" TERMS.txt

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          cp TERMS.txt build/linux/x64/release/bundle/
          tar -czf "dist/${APP_NAME}-v${VERSION}-Linux.tar.gz" -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v6
        with:
          name: app-${{ matrix.platform }}
          path: dist/*

  lib:
    needs: version
    name: Robot library (vendordep)
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set library version
        working-directory: ./pathplannerlib
        run: sed -i "s/def pubVersion = '0.0.0'/def pubVersion = '${VERSION}'/" publish.gradle

      - name: Build and publish to local Maven folder
        working-directory: ./pathplannerlib
        run: |
          chmod +x gradlew
          ./gradlew publishJavaPublicationToMavenRepository -PreleaseMode

      - name: Make vendordep site
        run: |
          mkdir -p site/repo
          cp -r pathplannerlib/build/repos/releases/. site/repo/
          cat > site/PathplannerLib-BackupPaths.json <<JSON
          {
              "fileName": "PathplannerLib-BackupPaths.json",
              "name": "PathplannerLib-BackupPaths",
              "version": "${VERSION}",
              "uuid": "3d6a28a7-468a-4c75-afd7-ccf2a78e3135",
              "frcYear": "2026",
              "mavenUrls": [
                  "${SITE_URL}/repo"
              ],
              "jsonUrl": "${SITE_URL}/PathplannerLib-BackupPaths.json",
              "conflictsWith": [
                  {
                      "uuid": "1b42324f-17c6-4875-8e77-1c312bc8c786",
                      "errorMessage": "PathplannerLib-BackupPaths replaces PathplannerLib. Remove PathplannerLib from vendordeps first.",
                      "offlineFileName": "PathplannerLib.json"
                  }
              ],
              "javaDependencies": [
                  {
                      "groupId": "io.github.aarya470",
                      "artifactId": "PathplannerLibBackupPaths-java",
                      "version": "${VERSION}"
                  }
              ],
              "jniDependencies": [],
              "cppDependencies": []
          }
          JSON
          python3 -m json.tool site/PathplannerLib-BackupPaths.json > /dev/null
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://github.com/${GITHUB_REPOSITORY}/releases/latest">
          <title>PathPlanner Backup Paths</title></head>
          <body><a href="https://github.com/${GITHUB_REPOSITORY}/releases/latest">Download PathPlanner Backup Paths</a></body></html>
          HTML
          cp site/PathplannerLib-BackupPaths.json .

      - name: Zip example robot project
        run: |
          sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/g" examples/backup-paths-java/vendordeps/PathplannerLib-BackupPaths.json
          mkdir -p example
          cd examples
          zip -qr "../example/PathPlannerBackupPaths-v${VERSION}-ExampleRobot.zip" backup-paths-java -x "*/build/*" "*/.gradle/*"

      - uses: actions/upload-artifact@v6
        with:
          name: example
          path: example/*

      - uses: actions/upload-artifact@v6
        with:
          name: site
          path: site

      - uses: actions/upload-artifact@v6
        with:
          name: vendordep
          path: PathplannerLib-BackupPaths.json

  publish:
    needs: [version, app, lib]
    name: Publish release
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Check out first: checkout clears the folder, so it must come before the downloads
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish vendordep to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/site
          keep_files: true

      - name: Write release notes
        run: |
          python3 - <<'PY2'
          import os
          v = os.environ["VERSION"]
          site = os.environ["SITE_URL"]
          notes, inside = [], False
          for line in open("CHANGELOG.md", encoding="utf-8").read().splitlines():
              if line.startswith("## "):
                  if inside:
                      break
                  inside = line[3:].strip() == v
                  continue
              if inside:
                  notes.append(line)
          body = "## What's new\n\n" + "\n".join(notes).strip() + "\n\n"
          body += "## Download\n\n"
          body += "- **Windows:** `-Windows-setup.exe` (installer, updates itself from inside the app) or `-Windows-portable.zip`\n"
          body += "- **macOS:** `-macOS.zip`. The app is unsigned, so the first time, right-click it and choose **Open**.\n"
          body += "- **Linux:** `-Linux.tar.gz`, then run `./pathplanner` from the extracted folder.\n\n"
          body += "## Robot library (Java)\n\n"
          body += "In WPILib VS Code, run **WPILib: Manage Vendor Libraries > Install new libraries (online)** and paste:\n\n"
          body += "```\n" + site + "/PathplannerLib-BackupPaths.json\n```\n\n"
          body += "Remove `PathplannerLib.json` from your `vendordeps` folder first. To update later, use **Check for updates (online)**.\n\n"
          body += "**Example robot project:** `-ExampleRobot.zip` shows how to connect a PhotonVision detection camera to the regions.\n"
          open("release-notes.md", "w", encoding="utf-8").write(body)
          PY2

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(artifacts/app-windows/* artifacts/app-macos/* artifacts/app-linux/* artifacts/vendordep/* artifacts/example/*)
          if [ "${#files[@]}" -lt 6 ]; then
            echo "::error::Expected at least 6 files to attach, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" --title "PathPlanner Backup Paths v${VERSION}" --notes-file release-notes.md
            gh release upload "v${VERSION}" "${files[@]}" --clobber
          else
            gh release create "v${VERSION}" "${files[@]}" --title "PathPlanner Backup Paths v${VERSION}" --notes-file release-notes.md --target "${GITHUB_SHA}"
          fi
